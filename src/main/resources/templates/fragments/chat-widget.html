<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chat-widget">

    <style>
        #chat-toggle-btn {
            position: fixed; bottom: 28px; right: 28px; z-index: 9999;
            width: 56px; height: 56px; border-radius: 50%;
            background: #1a1612; color: #fff;
            border: none; cursor: pointer; font-size: 24px;
            box-shadow: 0 4px 18px rgba(26,22,18,0.25);
            transition: transform .2s, box-shadow .2s;
            display: flex; align-items: center; justify-content: center;
        }
        #chat-toggle-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(26,22,18,0.35); }

        #chat-panel {
            position: fixed; bottom: 96px; right: 28px; z-index: 9998;
            width: 370px; height: 520px;
            background: #faf9f6; border: 1px solid #e8e3db;
            border-radius: 18px; box-shadow: 0 8px 40px rgba(26,22,18,0.18);
            display: flex; flex-direction: column; overflow: hidden;
            transition: opacity .2s, transform .2s;
        }
        #chat-panel.hidden { display: none; }

        #chat-header {
            background: #1a1612; color: #faf9f6;
            padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        #chat-header span { font-family: 'DM Serif Display', serif; font-size: 16px; }
        #chat-close-btn {
            background: none; border: none; color: #faf9f6;
            font-size: 18px; cursor: pointer; line-height: 1; padding: 0;
        }

        #chat-body {
            flex: 1; overflow-y: auto; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .chat-starters-label {
            font-size: 12px; color: #78736a; font-weight: 700;
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
        }
        .starter-chip {
            display: block; width: 100%; text-align: left;
            background: #fff; border: 1px solid #e8e3db;
            border-radius: 10px; padding: 10px 14px;
            font-size: 13px; font-family: 'DM Sans', sans-serif;
            cursor: pointer; color: #1a1612;
            transition: border-color .15s, background .15s;
            margin-bottom: 6px;
        }
        .starter-chip:hover { border-color: #c0392b; background: #fff5f5; }

        .chat-msg {
            max-width: 88%; padding: 10px 14px;
            border-radius: 14px; font-size: 14px; line-height: 1.5;
            font-family: 'DM Sans', sans-serif; word-break: break-word;
        }
        .chat-msg.user {
            background: #1a1612; color: #faf9f6;
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant {
            background: #fff; border: 1px solid #e8e3db; color: #1a1612;
            align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .chat-msg.typing { color: #78736a; font-style: italic; }

        #chat-footer {
            padding: 12px 14px; border-top: 1px solid #e8e3db;
            display: flex; gap: 8px; flex-shrink: 0; background: #fff;
        }
        #chat-input {
            flex: 1; padding: 9px 14px; border: 1px solid #e8e3db;
            border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif;
            background: #faf9f6; outline: none;
        }
        #chat-input:focus { border-color: #c0392b; }
        #chat-send-btn {
            padding: 9px 16px; background: #c0392b; color: #fff;
            border: none; border-radius: 10px; font-size: 14px;
            font-weight: 700; cursor: pointer; transition: filter .15s;
        }
        #chat-send-btn:hover { filter: brightness(0.9); }
    </style>

    <button id="chat-toggle-btn" title="Book Assistant">💬</button>

    <div id="chat-panel" class="hidden">
        <div id="chat-header">
            <span>Book Assistant</span>
            <button id="chat-close-btn">✕</button>
        </div>
        <div id="chat-body">
            <div id="chat-starters-container"></div>
            <div id="chat-messages" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
        <div id="chat-footer">
            <input id="chat-input" type="text" placeholder="Ask about books..." autocomplete="off"/>
            <button id="chat-send-btn">Send</button>
        </div>
    </div>

    <script>
    (function () {
        function getContext() {
            const el = document.getElementById('page-context');
            if (!el) return { page: 'default' };
            return {
                page: el.dataset.page || 'default',
                bookTitle: el.dataset.bookTitle || '',
                bookAuthor: el.dataset.bookAuthor || '',
                bookGenre: el.dataset.bookGenre || ''
            };
        }

        const toggleBtn = document.getElementById('chat-toggle-btn');
        const panel = document.getElementById('chat-panel');
        const closeBtn = document.getElementById('chat-close-btn');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send-btn');
        const messagesDiv = document.getElementById('chat-messages');
        const startersContainer = document.getElementById('chat-starters-container');
        let startersLoaded = false;

        toggleBtn.addEventListener('click', function () {
            panel.classList.toggle('hidden');
            if (!startersLoaded) { loadStarters(); startersLoaded = true; }
        });
        closeBtn.addEventListener('click', function () { panel.classList.add('hidden'); });

        function loadStarters() {
            const ctx = getContext();
            const params = new URLSearchParams({
                page: ctx.page,
                bookTitle: ctx.bookTitle,
                bookAuthor: ctx.bookAuthor,
                bookGenre: ctx.bookGenre
            });
            fetch('/api/chat/starters?' + params.toString())
                .then(r => r.json())
                .then(data => {
                    const label = document.createElement('div');
                    label.className = 'chat-starters-label';
                    label.textContent = 'Conversation starters';
                    startersContainer.appendChild(label);
                    data.starters.forEach(function (starter) {
                        const chip = document.createElement('button');
                        chip.className = 'starter-chip';
                        chip.textContent = starter;
                        chip.addEventListener('click', function () {
                            startersContainer.style.display = 'none';
                            sendMessage(starter);
                        });
                        startersContainer.appendChild(chip);
                    });
                })
                .catch(function () {});
        }

        function addMessage(role, text) {
            const msg = document.createElement('div');
            msg.className = 'chat-msg ' + role;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msg;
        }

        function sendMessage(text) {
            startersContainer.style.display = 'none';
            addMessage('user', text);
            const typing = addMessage('assistant', '...');
            typing.classList.add('typing');

            const ctx = getContext();
            fetch('/api/chat/message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    page: ctx.page,
                    bookTitle: ctx.bookTitle,
                    bookAuthor: ctx.bookAuthor
                })
            })
            .then(r => r.json())
            .then(function (data) {
                typing.remove();
                addMessage('assistant', data.response);
            })
            .catch(function () {
                typing.remove();
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            });
        }

        sendBtn.addEventListener('click', function () {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            sendMessage(text);
        });

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendBtn.click();
        });
    })();
    </script>
</div>
</body>
</html>
