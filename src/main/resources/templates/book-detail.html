<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title} + ' – Book Detail'">Book Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --panel: #ffffff;
            --border: #e8e3db;
            --text: #1a1612;
            --muted: #78736a;
            --accent: #c0392b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .topbar {
            background: var(--text); color: #faf9f6;
            padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
        }
        .topbar a { color: #e8c88a; text-decoration: none; font-size: 14px; font-weight: 500; }
        .topbar h1 { font-family: 'DM Serif Display', serif; font-size: 22px; }

        .content { padding: 40px 32px; max-width: 800px; margin: 0 auto; }

        .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
        .breadcrumb a { color: var(--accent); text-decoration: none; }

        .book-hero {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 18px; padding: 36px; box-shadow: 0 4px 20px rgba(26,22,18,0.08);
            margin-bottom: 24px;
        }

        .book-hero h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 38px; line-height: 1.1; margin-bottom: 8px;
        }

        .book-author { font-size: 16px; color: var(--muted); margin-bottom: 20px; }
        .book-author strong { color: var(--text); }

        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .tag {
            background: #f0ece4; color: #5a4f3e;
            font-size: 13px; font-weight: 700;
            padding: 5px 14px; border-radius: 20px;
        }
        .tag.level { background: #fef3e2; color: #a0580a; }
        .tag.genre { background: #e8f0fe; color: #1a56db; }

        .book-description {
            font-size: 16px; line-height: 1.7; color: #3a3530;
            padding-top: 20px; border-top: 1px solid var(--border);
        }

        .meta-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px;
        }
        .meta-item {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 14px 16px;
        }
        .meta-item span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
        .meta-item strong { font-size: 16px; }

        .actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn {
            padding: 11px 22px; border-radius: 9px; font-size: 14px;
            font-weight: 700; text-decoration: none; cursor: pointer;
            border: none; transition: filter .15s; display: inline-block;
        }
        .btn:hover { filter: brightness(0.9); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); }

        .rdf-section {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px 24px;
        }
        .rdf-section h2 { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 12px; }
        .rdf-section pre {
            background: #1a1612; color: #e8c88a;
            border-radius: 10px; padding: 16px;
            font-size: 12px; overflow-x: auto; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word;
        }
    </style>
</head>
<body th:attr="data-page=${'book:' + book.id}">
    <div class="topbar">
        <h1>📚 Book Detail</h1>
        <a href="/books">← All Books</a>
    </div>

    <div class="content">
        <div class="book-hero">
            <h1 th:text="${book.title}">Book Title</h1>
            <div class="book-author" th:if="${not #strings.isEmpty(book.author)}">
                by <strong th:text="${book.author}">Author</strong>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <span>Reading Level</span>
                    <strong th:text="${not #strings.isEmpty(book.readingLevel) ? book.readingLevel : '—'}">Level</strong>
                </div>
                <div class="meta-item">
                    <span>Genres</span>
                    <strong th:text="${not #lists.isEmpty(book.genres) ? #strings.listJoin(book.genres, ', ') : '—'}">Genres</strong>
                </div>
                <div class="meta-item">
                    <span>Book ID</span>
                    <strong th:text="${book.id}">id</strong>
                </div>
            </div>

            <div class="tags">
                <span class="tag genre" th:each="genre : ${book.genres}" th:text="${genre}">Genre</span>
                <span class="tag level" th:if="${not #strings.isEmpty(book.readingLevel)}" th:text="${book.readingLevel}">Level</span>
            </div>

            <div class="book-description" th:if="${not #strings.isEmpty(book.description)}" th:text="${book.description}">Description</div>

            <div class="actions">
                <a class="btn btn-primary" th:href="@{/books/edit(id=${book.id})}">✏️ Edit Book</a>
                <a class="btn btn-secondary" href="/books">← Back to Books</a>
            </div>
        </div>
    </div>
</body>
</html>
