<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book – Book Recommendation System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --panel: #ffffff;
            --border: #e8e3db;
            --text: #1a1612;
            --muted: #78736a;
            --accent: #c0392b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .topbar {
            background: var(--text); color: #faf9f6;
            padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
        }
        .topbar a { color: #e8c88a; text-decoration: none; font-size: 14px; font-weight: 500; }
        .topbar h1 { font-family: 'DM Serif Display', serif; font-size: 22px; }

        .content { padding: 40px 32px; max-width: 640px; margin: 0 auto; }

        .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
        .breadcrumb a { color: var(--accent); text-decoration: none; }

        .form-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 18px; padding: 36px;
            box-shadow: 0 4px 20px rgba(26,22,18,0.08);
        }
        .form-card h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 26px; margin-bottom: 24px;
        }

        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 12px; font-weight: 700;
            color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
            margin-bottom: 6px;
        }
        .field input, .field select, .field textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: 9px; font-size: 14px; font-family: inherit;
            background: var(--bg); color: var(--text);
            transition: border-color .15s;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .actions { display: flex; gap: 12px; margin-top: 28px; }
        .btn {
            padding: 12px 24px; border-radius: 9px; font-size: 14px;
            font-weight: 700; cursor: pointer; border: none;
            text-decoration: none; display: inline-block; transition: filter .15s;
        }
        .btn:hover { filter: brightness(0.9); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); }

        .info-box {
            background: #e8f4fd; border: 1px solid #b3d8f5; border-radius: 10px;
            padding: 12px 16px; font-size: 13px; color: #1a56aa;
            margin-bottom: 24px; line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>📚 Book Editor</h1>
        <a href="/books">← All Books</a>
    </div>

    <div class="content">
        <div class="form-card">
            <h2 th:text="${book != null ? 'Edit: ' + book.title : 'Add New Book'}">Add / Edit Book</h2>

            <form method="post" action="/books/save">
                <div class="field">
                    <label for="title">Title *</label>
                    <input id="title" type="text" name="title"
                           th:value="${book != null ? book.title : 'Harry Potter'}"
                           required placeholder="e.g. Harry Potter">
                </div>

                <div class="field">
                    <label for="author">Author</label>
                    <input id="author" type="text" name="author"
                           th:value="${book != null ? book.author : ''}"
                           placeholder="e.g. J.K. Rowling">
                </div>

                <div class="field">
                    <label for="genres">Genres</label>
                    <input id="genres" type="text" name="genres"
                           th:value="${book != null ? #strings.listJoin(book.genres, ', ') : 'Fantasy, Magic'}"
                           placeholder="e.g. Fantasy, Science Fiction">
                    <div class="hint">Separate multiple genres with commas.</div>
                </div>

                <div class="field">
                    <label for="readingLevel">Reading Level *</label>
                    <select id="readingLevel" name="readingLevel">
                        <option th:selected="${book != null and book.readingLevel == 'Beginner'}">Beginner</option>
                        <option th:selected="${book == null or book.readingLevel == 'Intermediate'}">Intermediate</option>
                        <option th:selected="${book != null and book.readingLevel == 'Advanced'}">Advanced</option>
                    </select>
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"
                              th:text="${book != null ? book.description : ''}"
                              placeholder="Short description of the book..."></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">💾 Save Book (via Jena)</button>
                    <a href="/books" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
