<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Book Recommendation System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --text: #1a1612;
            --accent: #c0392b;
            --accent-2: #e67e22;
            --border: #e8e3db;
            --muted: #78736a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(192,57,43,.08), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(230,126,34,.06), transparent 35%),
                var(--bg);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }

        .container {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 12px 48px rgba(26,22,18,.1);
            padding: 48px 44px;
            max-width: 580px; width: 100%;
        }

        .eyebrow {
            text-transform: uppercase; letter-spacing: .14em;
            font-size: 11px; color: var(--accent); font-weight: 700;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 38px; line-height: 1.1;
            color: var(--text); margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 36px;
        }

        .nav-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
        }

        .nav-item {
            display: block; padding: 24px 20px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 14px; text-decoration: none;
            transition: transform .2s, box-shadow .2s, border-color .2s;
        }
        .nav-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(192,57,43,.12);
            border-color: var(--accent);
        }

        .nav-item-icon { font-size: 28px; margin-bottom: 10px; display: block; }
        .nav-item h3 { font-size: 16px; color: var(--text); margin-bottom: 5px; font-weight: 700; }
        .nav-item p { font-size: 13px; color: var(--muted); line-height: 1.4; }

        .badge {
            display: inline-block; background: #fef3e2; color: #a0580a;
            font-size: 11px; font-weight: 700; padding: 2px 8px;
            border-radius: 20px; margin-top: 8px;
        }
    </style>
</head>
<body data-page="home">
    <div id="page-context" data-page="home"></div>
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>
    <div class="container">
        <div class="eyebrow">Semantic Web · Homework 2</div>
        <h1 th:text="${title}">Book Recommendation System</h1>

        <div class="nav-grid">
            <a href="/books" class="nav-item">
                <span class="nav-item-icon">📚</span>
                <h3>Books</h3>
            </a>
            <a href="/visualize" class="nav-item">
                <span class="nav-item-icon">🔍</span>
                <h3>RDF Graph</h3>
            </a>
        </div>
    </div>
</body>
</html>
