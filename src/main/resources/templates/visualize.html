<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDF Visualization - Book Recommendation System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f6;
            --panel: #ffffff;
            --border: #e8e3db;
            --text: #1a1612;
            --accent: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .topbar {
            background: var(--text);
            color: #faf9f6;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
        }

        .topbar a {
            color: #e8c88a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .content {
            padding: 28px 32px 40px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(26,22,18,0.07);
            margin-bottom: 18px;
        }

        .notice {
            margin-bottom: 12px;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .notice.success {
            background: #eaf7ef;
            color: #166534;
            border: 1px solid #b7e1c1;
        }

        .notice.error {
            background: #fff1f2;
            color: #9f1239;
            border: 1px solid #fecdd3;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #78736a;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 6px;
        }

        input[type="file"] {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            background: #fff;
        }

        .button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .graph-frame {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: auto;
            min-height: 620px;
            background: #fff;
        }

        svg {
            display: block;
            min-width: 980px;
            min-height: 640px;
        }

        .edge-line {
            stroke: #c4b9aa;
            stroke-width: 1.1;
        }

        .node-resource {
            fill: #c0392b;
            opacity: 0.88;
        }

        .node-literal {
            fill: #f59e0b;
            opacity: 0.88;
        }

        .node-label {
            fill: #1a1612;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
        }

        .edge-label {
            fill: #7a6f62;
            font-size: 10px;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="page-context" data-page="visualize"></div>
    <div th:replace="~{fragments/chat-widget :: chat-widget}"></div>
<div class="topbar">
    <h1>RDF Graph Visualization</h1>
    <a href="/">← Back to Home</a>
</div>

<div class="content">
    <div class="card">
        <div class="notice success" th:if="${message}" th:text="${message}"></div>
        <div class="notice error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form method="post" action="/visualize/upload" enctype="multipart/form-data">
            <div class="form-group">
                <label for="rdfFile">RDF/XML file</label>
                <input type="file" id="rdfFile" name="file" accept=".rdf,.xml" required>
            </div>
            <button class="button" type="submit">Load and Visualize</button>
        </form>
    </div>

    <div class="graph-frame" th:if="${hasGraph}">
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
            <g th:each="edge : ${graphEdges}">
                <line class="edge-line"
                      th:attr="x1=${edge.sourceX},y1=${edge.sourceY},x2=${edge.targetX},y2=${edge.targetY}" />
                <text class="edge-label"
                      th:attr="x=${(edge.sourceX + edge.targetX) / 2},y=${(edge.sourceY + edge.targetY) / 2 - 6}"
                      th:text="${edge.label}"></text>
            </g>
            <g th:each="node : ${graphNodes}">
                <circle th:classappend="${' node-' + node.type}"
                        th:attr="cx=${node.x},cy=${node.y},r=${node.type == 'literal' ? 24 : 30}" />
                <text class="node-label"
                      th:attr="x=${node.x},y=${node.y + 44}"
                      th:text="${node.label}"></text>
            </g>
        </svg>
    </div>

    <div class="graph-frame" th:if="${!hasGraph}" style="display:flex;align-items:center;justify-content:center;color:#78736a;min-height:420px;">
        Upload an RDF/XML file to display the graph.
    </div>
</div>
</body>
</html>
